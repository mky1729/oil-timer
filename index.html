<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8e9e7">
<title>Oil Timer — 3 minutes of calm</title>
<style>
:root{font-family:"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#53575b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:#e4e7e7}
.room{min-height:100vh;position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wall{position:absolute;inset:0 0 26% 0;z-index:-3;background:radial-gradient(ellipse at 48% 24%,#f2f3f0 0%,#e0e4e3 55%,#c7cfce 100%)}
.wall:after{content:"";position:absolute;inset:0;opacity:.22;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23888888' filter='url(%23n)' opacity='.19' d='M0 0h140v140H0z'/%3E%3C/svg%3E")}
.wall:before{content:"";position:absolute;right:7%;top:9%;width:min(22vw,210px);height:min(25vw,240px);border:11px solid #675a54;box-shadow:0 8px 22px #4c403522,inset 0 0 0 1px #fff6;background:linear-gradient(135deg,#faf7ef,#d8dddc);opacity:.34;transform:rotate(.6deg)}
.tabletop{position:absolute;top:74%;bottom:0;left:0;right:0;z-index:-2;border-top:7px solid #b88e70;background:repeating-linear-gradient(1deg,transparent 0 10px,#79533c0d 11px 12px,transparent 13px 32px),linear-gradient(90deg,#9c6b4c,#d7ae88 29%,#bd8b66 64%,#9d6f50);box-shadow:inset 0 16px 22px #79553e3a,0 -4px 24px #ffffff80}
.tabletop:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(91deg,transparent 0 95px,#6f49381b 97px 99px,transparent 101px 210px),linear-gradient(180deg,#ffffff24,#2c170a13);opacity:.62}
.light{position:absolute;left:50%;bottom:17%;width:460px;height:90px;transform:translateX(-50%);background:#48352542;filter:blur(30px);border-radius:50%;z-index:-1}
.app{width:min(100%,930px);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 22px 32px}
.header{text-align:center;margin:0 0 2px;text-shadow:0 1px 8px #ffffffbc}
.eyebrow{font-size:10px;letter-spacing:.42em;font-weight:600;color:#8b9292}.header h1{margin:8px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,5vw,43px);font-weight:400;letter-spacing:.085em;color:#505657}.subtitle{margin:9px 0 0;font-size:11px;letter-spacing:.19em;color:#8a9190}
.timer-stage{position:relative;width:min(410px,82vw);margin:-6px auto -8px;filter:drop-shadow(11px 16px 10px #42392d34)}
.timer-stage svg{display:block;width:100%;height:auto;overflow:visible}
.glass-body{fill:url(#glassBody);stroke:#ffffffc9;stroke-width:3}.glass-outline{fill:none;stroke:#8299a09c;stroke-width:6}.glass-inner{fill:none;stroke:#fff;stroke-opacity:.68;stroke-width:2}
.drop{opacity:.92}.oil-thread{stroke-linecap:round;filter:drop-shadow(0 0 3px #fff8)}.controls{z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:12px}
.clock{font:300 35px/1 Georgia,"Times New Roman",serif;letter-spacing:.1em;font-variant-numeric:tabular-nums;color:#50595b;text-shadow:0 1px 10px #ffffffb0}
.actions{display:flex;gap:12px;align-items:center}
button{appearance:none;border:1px solid #fff9;background:#ffffffa9;color:#566160;padding:12px 27px;border-radius:999px;cursor:pointer;font:500 12px/1 "Segoe UI",sans-serif;letter-spacing:.16em;min-width:105px;box-shadow:0 4px 18px #6d67502b;backdrop-filter:blur(12px);transition:background .2s,transform .2s}
button:hover{background:#fff;transform:translateY(-1px)}button:focus-visible{outline:3px solid #008c94;outline-offset:3px}
button.primary{background:#526b68;color:white;border-color:#526b68}button.primary:hover{background:#375955}
.caption{font-size:11px;letter-spacing:.12em;color:#74807e;text-shadow:0 1px 8px #fff}
@media(max-height:780px){.app{justify-content:flex-start}.timer-stage{width:min(305px,65vh);margin-top:-4px}.header h1{font-size:31px}.subtitle{margin-top:4px}.clock{font-size:30px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main class="room">
 <div class="wall" aria-hidden="true"></div><div class="tabletop" aria-hidden="true"></div><div class="light" aria-hidden="true"></div>
 <div class="app">
 <header class="header"><div class="eyebrow">A MOMENT OF STILLNESS</div><h1>Oil Timer</h1><p class="subtitle">ふたつの色が、ゆっくり時を刻む。</p></header>
 <div class="timer-stage">
 <svg viewBox="0 0 400 620" role="img" aria-label="くびれた透明のガラス容器の中心からピンクと青緑のオイルが落ちるアニメーション">
 <defs>
  <linearGradient id="glassBody" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".45"/><stop offset=".09" stop-color="#f8ffff" stop-opacity=".08"/><stop offset=".48" stop-color="#d8f8fa" stop-opacity=".035"/><stop offset=".56" stop-color="#ffffff" stop-opacity=".14"/><stop offset=".88" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".85"/><stop offset=".26" stop-color="#b5c6cc" stop-opacity=".22"/><stop offset=".72" stop-color="#fff" stop-opacity=".23"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
  <linearGradient id="pink" x1="0" x2="1" y1="0" y2=".7"><stop stop-color="#ffb0d2" stop-opacity=".91"/><stop offset=".38" stop-color="#f52c92" stop-opacity=".78"/><stop offset="1" stop-color="#b92bb0" stop-opacity=".65"/></linearGradient>
  <linearGradient id="teal" x1="0" x2="1" y1="0" y2=".8"><stop stop-color="#b1fff3" stop-opacity=".92"/><stop offset=".45" stop-color="#19d6c8" stop-opacity=".8"/><stop offset="1" stop-color="#038aa2" stop-opacity=".73"/></linearGradient>
  <linearGradient id="reservoir" x1="0" x2="1" y1="0" y2=".2"><stop stop-color="#ff4ea9" stop-opacity=".62"/><stop offset=".44" stop-color="#ec47ba" stop-opacity=".66"/><stop offset=".50" stop-color="#7fe6dc" stop-opacity=".52"/><stop offset=".62" stop-color="#24d4cb" stop-opacity=".66"/><stop offset="1" stop-color="#0a95b5" stop-opacity=".72"/></linearGradient>
  <linearGradient id="lowerPool" x1="0" x2=".5" y1="0" y2="1"><stop stop-color="#ff7fc3" stop-opacity=".49"/><stop offset=".6" stop-color="#24cfcb" stop-opacity=".6"/><stop offset="1" stop-color="#038eaf" stop-opacity=".65"/></linearGradient>
  <radialGradient id="shine" cx=".29" cy=".2" r=".8"><stop stop-color="#fff" stop-opacity=".77"/><stop offset=".4" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <clipPath id="interior"><path d="M103 43 Q94 45 94 61 L94 123 C94 194 138 244 179 309 C138 374 94 442 94 532 L94 558 Q94 567 108 567 L292 567 Q306 567 306 558 L306 532 C306 442 262 374 221 309 C262 244 306 194 306 123 L306 61 Q306 45 297 43Z"/></clipPath>
 </defs>
 <!-- Rear rim and transparent glass -->
 <path class="glass-outline" d="M91 37 Q83 37 83 57 L83 126 C83 194 135 258 168 309 C135 366 83 448 83 532 L83 566 Q83 582 104 582 L296 582 Q317 582 317 566 L317 532 C317 448 265 366 232 309 C265 258 317 194 317 126 L317 57 Q317 37 309 37Z"/>
 <path class="glass-body" d="M91 37 Q83 37 83 57 L83 126 C83 194 135 258 168 309 C135 366 83 448 83 532 L83 566 Q83 582 104 582 L296 582 Q317 582 317 566 L317 532 C317 448 265 366 232 309 C265 258 317 194 317 126 L317 57 Q317 37 309 37Z"/>
 <g clip-path="url(#interior)">
  <path id="upper-oil" fill="url(#reservoir)" d="M94 84 L306 84 L306 124 Q295 162 266 204 Q235 250 200 295 Q165 250 134 204 Q105 162 94 124Z"/>
  <path id="upper-surface" d="M96 85 Q148 78 200 86 T304 85" fill="none" stroke="#ffe8fb" stroke-opacity=".8" stroke-width="4"/>
  <path id="pink-thread" class="oil-thread" d="M193 286 C190 297 190 303 193 314" fill="none" stroke="url(#pink)" stroke-width="4" stroke-opacity=".72"/>
  <path id="teal-thread" class="oil-thread" d="M207 286 C210 297 210 303 207 314" fill="none" stroke="url(#teal)" stroke-width="4" stroke-opacity=".72"/>
  <g id="droplets"></g>
  <path id="pool" fill="url(#lowerPool)" d="M105 560 L295 560 L295 565 L105 565Z"/>
  <g id="beads"></g>
  <path d="M108 558 Q190 567 291 558" stroke="#fff" stroke-opacity=".25" stroke-width="2" fill="none"/>
 </g>
 <path class="glass-inner" d="M98 62 L98 124 C98 202 144 254 181 308 M219 308 C256 254 302 202 302 124 L302 62 M181 312 C148 377 98 451 98 528 M219 312 C252 377 302 451 302 528"/>
 <path d="M88 45 Q94 39 106 39 L294 39 Q306 40 312 47" fill="none" stroke="url(#edge)" stroke-width="9" stroke-linecap="round"/>
 <path d="M99 43 L301 43" stroke="#fff" stroke-opacity=".86" stroke-width="3" stroke-linecap="round"/>
 <path d="M88 570 Q91 580 109 580 H291 Q309 580 312 570" fill="none" stroke="url(#edge)" stroke-width="9" stroke-linecap="round"/>
 <path d="M104 571 Q200 575 296 571" fill="none" stroke="#fff" stroke-opacity=".66" stroke-width="3"/>
 <path d="M92 85 Q87 176 145 276" stroke="white" stroke-opacity=".36" stroke-width="5" fill="none" stroke-linecap="round"/>
 <path d="M309 90 Q313 175 255 276" stroke="white" stroke-opacity=".43" stroke-width="3" fill="none" stroke-linecap="round"/>
 <path d="M149 360 Q103 440 91 503" stroke="white" stroke-opacity=".35" stroke-width="4" fill="none" stroke-linecap="round"/>
 <path d="M251 360 Q297 439 309 508" stroke="white" stroke-opacity=".33" stroke-width="4" fill="none" stroke-linecap="round"/>
 <path d="M164 308 Q200 330 236 308" stroke="#ffffff" stroke-opacity=".22" stroke-width="10" fill="none" stroke-linecap="round"/>
 </svg>
 </div>
 <section class="controls" aria-label="タイマー操作">
 <div id="clock" class="clock" role="timer" aria-label="残り時間">03:00</div>
 <div class="actions"><button id="start" class="primary">スタート</button><button id="reset">リセット</button></div>
 <div id="status" class="caption" aria-live="polite">静かな3分間を。</div>
 </section>
 </div>
</main>
<script>
(()=>{
'use strict';
const DURATION=180000, svgNS='http://www.w3.org/2000/svg';
const dropsGroup=document.getElementById('droplets'),beadsGroup=document.getElementById('beads');
const upper=document.getElementById('upper-oil'),surface=document.getElementById('upper-surface'),pool=document.getElementById('pool');
const pinkThread=document.getElementById('pink-thread'),tealThread=document.getElementById('teal-thread');
const clock=document.getElementById('clock'),startButton=document.getElementById('start'),resetButton=document.getElementById('reset'),status=document.getElementById('status');
let elapsed=0,elapsedBeforeRun=0,runStartedAt=0,running=false,lastFrame=0,raf=0,spawnAccumulator=0,dropNumber=0;
let drops=[],beads=[];
function el(name,attrs){const node=document.createElementNS(svgNS,name);for(const [key,value] of Object.entries(attrs))node.setAttribute(key,value);return node}
function makeDrop(tone,side){
 const node=el('g',{}),shadow=el('ellipse',{cx:0,cy:0,rx:9,ry:13,fill:tone==='pink'?'url(#pink)':'url(#teal)'});
 const glint=el('ellipse',{cx:-3,cy:-5,rx:2.8,ry:4.2,fill:'white','fill-opacity':'.36'});
 node.append(shadow,glint);dropsGroup.append(node);
 drops.push({node,tone,age:0,duration:2300+Math.random()*900,side,offset:(Math.random()-.5)*3,radius:8+Math.random()*3});
}
function addDropPair(){
 dropNumber++;
 makeDrop('pink',-1);
 makeDrop('teal',1);
}
function deposit(d){
 const x=105+Math.random()*190,y=551-Math.random()*Math.min(70,8+elapsed/DURATION*84);
 const n=el('ellipse',{cx:x,cy:y,rx:4+Math.random()*10,ry:3+Math.random()*8,fill:d.tone==='pink'?'url(#pink)':'url(#teal)',opacity:'.7'});
 beadsGroup.append(n);beads.push(n);
 if(beads.length>145){beads.shift().remove()}
}
function draw(){
 const p=Math.min(1,elapsed/DURATION);
 // The upper reservoir tapers gradually and drains by the end of the three minutes.
 const level=86+p*208, bottom=294-p*12;
 upper.setAttribute('d', 'M94 '+level+' Q200 '+(level-6)+' 306 '+level+' L306 '+(level+15)+' Q294 '+(level+55)+' 260 '+(level+103)+' L200 '+bottom+' L140 '+(level+103)+' Q106 '+(level+55)+' 94 '+(level+15)+'Z');
 upper.setAttribute('opacity',String(Math.max(0,1-p*1.17)));
 surface.setAttribute('d','M96 '+level+' Q148 '+(level-7)+' 200 '+level+' T304 '+level);
 surface.setAttribute('opacity',String(Math.max(0,1-p)));
 const threadOpacity=Math.max(0,Math.min(1,(1-p)*1.25));
 pinkThread.setAttribute('opacity',String(threadOpacity));
 tealThread.setAttribute('opacity',String(threadOpacity));
 pinkThread.setAttribute('d','M193 '+(bottom-8)+' C190 '+(bottom+4)+' 190 305 193 318');
 tealThread.setAttribute('d','M207 '+(bottom-8)+' C210 '+(bottom+4)+' 210 305 207 318');
 const top=556-p*110;
 pool.setAttribute('d', 'M94 '+top+' Q147 '+(top-9)+' 200 '+top+' T306 '+top+' L306 567 L94 567Z');
 pool.setAttribute('opacity',String(.3+.65*p));
 for(const d of drops){
   const t=Math.min(1,d.age/d.duration);
   const y=309+242*t*t;
   const x=200+d.side*(6+8*t)+d.offset*Math.sin(t*Math.PI*2);
   const sx=1+.1*Math.sin(t*Math.PI);
   const sy=1+.22*Math.sin(t*Math.PI);
   d.node.setAttribute('transform','translate('+x+' '+y+') scale('+sx+' '+sy+')');
   d.node.setAttribute('opacity',String(Math.min(1,(1-t)*5)));
 }
 const seconds=Math.ceil((DURATION-elapsed)/1000);
 clock.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
}
function tick(now){
 if(!running)return;
 const delta=Math.min(80,now-lastFrame);lastFrame=now;
 elapsed=Math.min(DURATION,elapsedBeforeRun+now-runStartedAt);
 spawnAccumulator+=delta;
 while(spawnAccumulator>=1650&&elapsed<DURATION){spawnAccumulator-=1650;addDropPair()}
 for(let i=drops.length-1;i>=0;i--){
  const d=drops[i];d.age+=delta;
  if(d.age>=d.duration){deposit(d);d.node.remove();drops.splice(i,1)}
 }
 draw();
 if(elapsed>=DURATION){running=false;elapsedBeforeRun=DURATION;startButton.textContent='もう一度';status.textContent='3分が経過しました。';return}
 raf=requestAnimationFrame(tick);
}
startButton.addEventListener('click',()=>{
 if(elapsed>=DURATION){reset()}
 if(running){running=false;cancelAnimationFrame(raf);elapsedBeforeRun=elapsed;startButton.textContent='再開';status.textContent='一時停止中';return}
 running=true;runStartedAt=performance.now();lastFrame=runStartedAt;startButton.textContent='一時停止';status.textContent='オイルがゆっくり落ちています';raf=requestAnimationFrame(tick);
});
function reset(){
 running=false;cancelAnimationFrame(raf);elapsed=0;elapsedBeforeRun=0;runStartedAt=0;spawnAccumulator=0;dropNumber=0;
 drops.forEach(d=>d.node.remove());beads.forEach(n=>n.remove());drops=[];beads=[];
 startButton.textContent='スタート';status.textContent='静かな3分間を。';draw();
}
resetButton.addEventListener('click',reset);
draw();
})();
</script>
</body>
</html>
